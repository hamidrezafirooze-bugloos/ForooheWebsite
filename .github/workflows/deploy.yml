name: Deploy to FTP host

on:
  push:
    branches:
      - claude/peaceful-brown-91z72o
  workflow_dispatch: {}

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload site files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: /zino/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            CLAUDE.md
            package.json
            reference/**
