<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Foroohe Design Studio</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e4e4e4}
  body{display:flex;align-items:center;justify-content:center;overflow:hidden}
  .stage{width:min(92vw,960px);aspect-ratio:16/9}
  video{width:100%;height:100%;object-fit:contain;display:block;background:#e4e4e4}
</style>
</head>
<body>
  <div class="stage">
    <video autoplay muted loop playsinline poster="logo-poster.jpg">
      <source src="logo-motion.mp4" type="video/mp4">
    </video>
  </div>
</body>
</html>
